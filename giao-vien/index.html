<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex" />
    <title>Trang giáo viên · Vườn Chữ Kì Diệu</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f4d3d'/%3E%3Cpath fill='%23fff' d='M12 20c-.5 0-.8-.3-.8-.8v-4.4C7.6 14.4 5.2 11.8 5.2 8.6V7.4c0-.4.3-.8.8-.8 2.6 0 4.7 1.4 5.6 3.4 1.1-2.3 3.4-4.2 6.3-4.2.4 0 .8.3.8.8v1.2c0 3.6-2.8 6.5-6 6.9v4.5c0 .5-.3.8-.7.8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="gv.css" />
    <link rel="stylesheet" href="thong-ke.css" />
    <link rel="stylesheet" href="admin-giao-vien.css" />
    <link rel="stylesheet" href="trang-day-hoc.css" />
    <link rel="stylesheet" href="goi-hoc-sinh.css" />
    <link rel="stylesheet" href="../phim.css" />
    <link rel="stylesheet" href="caller-cinema.css" />
    <link rel="stylesheet" href="caller-ufo.css" />
    <link rel="stylesheet" href="caller-journeys.css" />
    <link rel="stylesheet" href="giao-dien-moi.css" />
    <link rel="stylesheet" href="vai-tro.css" />
  </head>
  <body>
    <!-- Đăng nhập -->
    <main id="login" class="login" hidden>
      <form id="loginForm" class="login-card" autocomplete="off">
        <div class="brand"><span class="brand-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21c-.6 0-1-.4-1-1v-5.2C6.8 14.4 4 11.3 4 7.5V6a1 1 0 0 1 1-1c3 0 5.5 1.6 6.6 4C12.9 6.3 15.6 4 19 4a1 1 0 0 1 1 1v1.4c0 4.2-3.3 7.6-7 8.1V20c0 .6-.4 1-1 1"/></svg></span><div><b>Vườn Chữ Kì Diệu</b><small>Giáo viên và quản trị nhà trường</small></div></div>
        <h1>Đăng nhập</h1>
        <p class="muted">Quản lý lớp học, theo dõi học sinh, tải tài liệu và soạn câu hỏi.</p>
        <label for="loginUser">Tên đăng nhập</label>
        <input id="loginUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Tài khoản giáo viên" aria-describedby="loginUserHint" />
        <small id="loginUserHint" class="hint">Quản trị viên: nhập <b>admin</b> (hoặc để trống) và mật khẩu quản trị.</small>
        <label for="loginPass">Mật khẩu</label>
        <input id="loginPass" type="password" autocomplete="current-password" required />
        <p id="loginErr" class="form-err" role="alert"></p>
        <button class="btn primary wide" id="loginBtn">Đăng nhập</button>
        <p id="storageNote" class="hint"></p>
        <a class="link" href="../">← Về trang học sinh</a>
      </form>
    </main>

    <!-- Ứng dụng -->
    <div id="app" class="shell" hidden>
      <aside class="side" aria-label="Menu giáo viên">
        <div class="brand"><span class="brand-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21c-.6 0-1-.4-1-1v-5.2C6.8 14.4 4 11.3 4 7.5V6a1 1 0 0 1 1-1c3 0 5.5 1.6 6.6 4C12.9 6.3 15.6 4 19 4a1 1 0 0 1 1 1v1.4c0 4.2-3.3 7.6-7 8.1V20c0 .6-.4 1-1 1"/></svg></span><div><b>Vườn Chữ</b><span class="role-chip" id="roleChip">Giáo viên</span></div></div>
        <nav id="nav" aria-label="Menu chính"></nav>
        <div class="side-foot">
          <div class="me-box" id="meBox" hidden><span class="me-avatar" id="meAvatar" aria-hidden="true"></span><span><b id="meName"></b><small id="meRole"></small></span></div>
          <button class="btn ghost wide" id="changePass" title="Đổi mật khẩu" aria-label="Đổi mật khẩu" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.65 10A6 6 0 1 0 7 18c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4zM7 14a2 2 0 1 1 2-2 2 2 0 0 1-2 2"/></svg><span class="cp-label"> Đổi mật khẩu</span></button>
          <a class="btn ghost wide" href="../" target="_blank" rel="noopener">Mở trang học sinh ↗</a>
          <button class="btn ghost wide" id="logout">Đăng xuất</button>
        </div>
      </aside>
      <div class="main">
        <header class="top">
          <div class="top-title"><span class="crumb" id="crumb" hidden>Quản trị trường</span><h1 id="pageTitle">Tổng quan</h1></div>
          <div class="top-tools">
            <button type="button" class="find-btn" id="quickFind" aria-keyshortcuts="Control+K"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9"/></svg><span>Tìm nhanh</span><kbd>Ctrl K</kbd></button>
            <span id="storageBadge" class="badge"></span>
          </div>
        </header>
        <div id="view" class="view" tabindex="-1"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dlg" class="dlg"><div id="dlgBody"></div></dialog>
    <div id="printArea" class="print-area" aria-hidden="true"></div>

    <script src="../data/ngan-hang-chinh-ta.js"></script>
    <script src="../data/sinh-cau.js"></script>
    <script src="../data/chuong-trinh.js"></script>
    <script src="excel.js"></script>
    <script src="bieu-do.js"></script>
    <script src="gv.js"></script>
    <script type="module" src="thong-ke.mjs"></script>
    <script type="module" src="admin-giao-vien.mjs"></script>
    <script src="../assets/vendor/gsap.min.js"></script>
    <script src="../qua-tang-am.js"></script>
    <script src="../qua-tang-fx.js"></script>
    <script src="../phim.js"></script>
    <script type="module" src="goi-hoc-sinh.js"></script>
    <script src="bai-hoc.js"></script>
    <script src="so-nhan-xet.js"></script>
    <script src="nhat-ky.js"></script>
    <script src="../season-options.js"></script>
    <script src="giao-dien.js"></script>
  </body>
</html>
